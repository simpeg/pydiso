name: Testing

on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Testing (Python ${{ matrix.python-version }}${{ matrix.free-threaded && 't' || '' }}, on ${{ matrix.os }}, with MKL ${{ matrix.mkl-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        mkl-version: ["2025", "2026"]
        free-threaded: [true, false]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            mkl-version: "2025"
            coverage: true
          - os: macos-15-intel
            python-version: "3.12"
            # Intel has not published MKL for macOS past 2023.2.
            mkl-version: "2023"
            free-threaded:
          - os: macos-15-intel
            python-version: "3.13"
            mkl-version: "2023"
            free-threaded:
        exclude:
          # Free-threaded builds don't exist prior to Python 3.13.
          - python-version: "3.12"
            free-threaded: true
          # Don't build free-threaded versions for experimental Python 3.13.
          - python-version: "3.13"
            free-threaded: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.13"

      - name: Create Conda environment file
        run: |
          python -m pip install pyyaml
          python .github/make_ci_environ.py
        env:
          PYTHON_VERSION: ${{ matrix.python-version}}
          MKL_VERSION: ${{ matrix.mkl-version }}
          FREE_THREADED: ${{ matrix.free-threaded && 'true' || 'false' }}
          DO_COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}
          ENV_NAME: pydiso-ci

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment_ci.yml
          activate-environment: pydiso-ci

      - name: Conda information
        run: |
          conda info
          conda list
          conda config --show

      - name: Install Our Package
        run: |
          # --no-deps: deps (incl. mkl) come from the conda env above, as a
          # conda-forge recipe would. [tool.meson-python] targets the
          # limited API unconditionally, which free-threaded builds before
          # 3.15 can't do at all (meson-python hard-fails otherwise) - opt
          # back out specifically for 3.14t. Once 3.15 is added to this
          # matrix, its free-threaded build should use the limited API
          # (abi3t) rather than being caught by this too, hence checking
          # python-version here rather than just matrix.free-threaded.
          python -m pip install --no-build-isolation --no-deps --verbose --editable . \
            --config-setting=compile-args=-v \
            ${{ matrix.coverage && '--config-settings=setup-args="-Db_coverage=true"' || ''}} \
            ${{ matrix.os == 'windows-latest' && '--config-settings=setup-args="-Dvsenv=true"' || ''}} \
            ${{ matrix.python-version == '3.14' && matrix.free-threaded && '--config-settings=setup-args="-Dpython.allow_limited_api=false"' || ''}}

      - name: Run Tests
        run: |
          ${{ matrix.coverage && 'coverage run -m' || '' }} pytest -s -v
          ${{ matrix.coverage && 'coverage xml' || '' }}

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          verbose: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required

  build-and-test-pypi-mkl:
    name: Testing (Python ${{ matrix.python-version }}, on ${{ matrix.os }}, with PyPI MKL)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: False
      matrix:
        # macOS excluded: Intel's PyPI mkl-devel wheel (frozen at 2023.2)
        # is missing a symlink CMake needs, so MKL fails to import. See README.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install our package against PyPI MKL
        run: |
          python -m pip install --upgrade pip
          python -m pip install --verbose ".[test]"

      - name: Run Tests
        run: pytest -s -v

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build sdist
        run: pipx run build --sdist -Csetup-args="-Ddist_ignore_mkl_dep=true"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  release:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Release to github
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false

      - name: Upload wheels to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: ./dist/
