name: Testing

on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Testing (Python ${{ matrix.python-version }}${{ matrix.free-threaded && 't' || '' }}, on ${{ matrix.os }}, with MKL ${{ matrix.mkl-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: False
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        mkl-version: ['2024', '2025']
        free-threaded: [true, false]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            mkl-version: "2024"
            coverage: true
          - os: macos-15-intel
            python-version: "3.11"
            mkl-version: "2023"
            free-threaded:
          - os: macos-15-intel
            python-version: "3.12"
            mkl-version: "2023"
            free-threaded:
        exclude:
          - python-version: "3.11"
            free-threaded: true
          - python-version: "3.12"
            free-threaded: true
          - python-version: "3.13"
            free-threaded: true
            mkl-version: "2025"
          - python-version: "3.14"
            mkl-version: "2025"

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.13"

    - name: Create Conda environment file
      run: |
        python -m pip install pyyaml
        python .github/make_ci_environ.py
      env:
        PYTHON_VERSION: ${{ matrix.python-version}}
        MKL_VERSION: ${{ matrix.mkl-version }}
        FREE_THREADED: ${{ matrix.free-threaded && 'true' || 'false' }}
        DO_COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}
        ENV_NAME: pydiso-ci

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        environment-file: environment_ci.yml
        activate-environment: pydiso-ci

    - name: Conda information
      run: |
        conda info
        conda list
        conda config --show

    - name: Install Our Package
      run: |
        python -m pip install --no-build-isolation --verbose --editable . \
          --config-setting=compile-args=-v \
          ${{ matrix.coverage && '--config-settings=setup-args="-Db_coverage=true"' || ''}} \
          ${{ matrix.os == 'windows-latest' && '--config-settings=setup-args="-Dvsenv=true"' || ''}}

    - name: Run Tests
      run: |
        ${{ matrix.coverage && 'coverage run -m' || '' }} pytest -s -v
        ${{ matrix.coverage && 'coverage xml' || '' }}

    - name: Upload coverage
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@v4
      with:
        verbose: true # optional (default = false)
        token: ${{ secrets.CODECOV_TOKEN }} # required

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  release:
    needs: [
      build_sdist
    ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/download-artifact@v4
      with:
        # unpacks all CIBW artifacts into dist/
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Release to github
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        prerelease: false

    - name: Upload wheels to pypi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
        packages-dir: ./dist/
