
[build-system]
build-backend = 'mesonpy'
requires = [
    "meson-python>=0.15.0",
    "Cython>=3.1.0",
    "setuptools_scm[toml]>=6.2",
    "numpy>=2.2.0",
    # The pkg-config executable itself: Windows has no system pkg-config at
    # all, and it isn't guaranteed present on Linux/macOS either. This ships
    # prebuilt pkgconf binaries so meson's dependency() lookups below always
    # have something to call, the same way `ninja` is fetched from PyPI
    # rather than assumed to be preinstalled. conda-forge builds normally
    # use `--no-build-isolation` with conda's own pkg-config already on
    # PATH, so this is never fetched from PyPI in that case.
    "pkgconf",
    # Headers and pkg-config/CMake files for Intel oneMKL, sourced from
    # PyPI. meson.build locates these automatically (see the top-level
    # meson.build for how pkg-config is pointed at them). conda-forge
    # builds normally use `--no-build-isolation` with conda's own
    # mkl-devel already on PKG_CONFIG_PATH, so these are never fetched
    # from PyPI in that case.
    # No upper bound: Intel has not published MKL for macOS past 2023.2,
    # so pip must be free to resolve that older version there while
    # getting the latest on Windows/Linux.
    "mkl-devel>=2023.0",
    "mkl-include>=2023.0",
]

[project]
name = 'pydiso'
dynamic = ["version"]
description = "Wrapper for intel's pardiso implementation in the MKL"
readme = 'README.md'
requires-python = '>=3.12'
authors = [
  {name = 'SimPEG developers', email = 'josephrcapriotti@gmail.com'},
]
keywords = [
    'sparse', 'solver', 'wrapper',
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/mesonbuild/meson-python/issues/29
    # Minimums follow SPEC 0: https://scientific-python.org/specs/spec-0000/
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    # Runtime Intel oneMKL shared libraries, from PyPI. No upper bound:
    # Intel has not published MKL for macOS past 2023.2, so pip must be
    # free to resolve that older version there while getting the latest on
    # Windows/Linux. conda-forge's recipe installs with `pip install
    # --no-deps` (as it does for numpy/scipy too) and supplies the `mkl`
    # conda package as a `run:` dependency instead, so this is never
    # fetched from PyPI for a conda-forge build.
    "mkl>=2023.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

[project.license]
file = 'LICENSE'

[project.optional-dependencies]
test = [
    "pytest",
]

coverage = [
    "coverage",
]

build = [
    "meson-python>=0.15.0",
    "meson",
    "ninja",
    "numpy>=2.2.0",
    "cython>=3.1.0",
    "setuptools_scm",
]

[project.urls]
Homepage = 'https://simpeg.xyz'
#Documentation = 'https://discretize.simpeg.xyz'
Repository = 'https://github.com/simpeg/pydiso.git'

[tool.setuptools_scm]

[tool.pytest.ini_options]
# The compiled `_mkl_solver` extension only exists in an installed pydiso,
# not in this source checkout. Pytest's default "prepend" import mode adds
# the rootdir to sys.path, which would shadow an installed package with the
# source tree's `pydiso/` directory and fail to import it. `importlib` mode
# imports test modules without mutating sys.path, so the installed package
# is what actually gets tested.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["pydiso", "tests"]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"