
[build-system]
build-backend = 'mesonpy'
requires = [
    "meson-python>=0.15.0",
    "Cython>=3.1.0",
    "setuptools_scm[toml]>=6.2",
    "numpy>=2.2.0",
    # Prebuilt pkg-config binary: Windows has no system one at all, and it
    # isn't guaranteed on Linux/macOS either. Fetched from PyPI like `ninja`.
    # 2.5.1.post2 and 3.0.1.post0 are excluded: their plain pkg-config/
    # pkgconf commands silently no-op whenever a search path is given
    # (exactly what our PKG_CONFIG_PATH default below needs). Reported
    # upstream: https://github.com/pypackaging-native/pkgconf-pypi/issues/116
    # Drop this exclusion once a release fixes it.
    "pkgconf!=2.5.1.post2,!=3.0.1.post0",
    # Headers and pkg-config/CMake files for Intel oneMKL. meson.build
    # points pkg-config at these automatically. No upper bound: Intel
    # hasn't published MKL for macOS past 2023.2, so pip needs to resolve
    # that older version there while getting the latest on Windows/Linux.
    "mkl-devel>=2023.0",
    "mkl-include>=2023.0",
]

[project]
name = 'pydiso'
dynamic = ["version"]
description = "Wrapper for intel's pardiso implementation in the MKL"
readme = 'README.md'
requires-python = '>=3.12'
authors = [
  {name = 'SimPEG developers', email = 'josephrcapriotti@gmail.com'},
]
keywords = [
    'sparse', 'solver', 'wrapper',
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/mesonbuild/meson-python/issues/29
    # Minimums follow SPEC 0: https://scientific-python.org/specs/spec-0000/
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    # Runtime Intel oneMKL shared libraries (see mkl-devel above for the
    # macOS caveat). conda-forge installs with `pip install --no-deps`
    # (as for numpy/scipy) and supplies the `mkl` conda package instead.
    "mkl>=2023.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

[project.license]
file = 'LICENSE'

[project.optional-dependencies]
test = [
    "pytest",
]

coverage = [
    "coverage",
]

build = [
    "meson-python>=0.15.0",
    "meson",
    "ninja",
    "numpy>=2.2.0",
    "cython>=3.1.0",
    "setuptools_scm",
]

[project.urls]
Homepage = 'https://simpeg.xyz'
#Documentation = 'https://discretize.simpeg.xyz'
Repository = 'https://github.com/simpeg/pydiso.git'

[tool.setuptools_scm]

[tool.pytest.ini_options]
# Default "prepend" import mode would shadow an installed pydiso with this
# source checkout's own pydiso/ directory (which lacks the compiled
# extension). importlib mode avoids that by not touching sys.path.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["pydiso", "tests"]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"