
[build-system]
build-backend = 'mesonpy'
requires = [
    # >=0.21.0 for abi3t (stable ABI for free-threaded builds) support.
    "meson-python>=0.21.0",
    "Cython>=3.1.0",
    "setuptools_scm[toml]>=6.2",
    "numpy>=2.2.0",
    # Prebuilt pkg-config binary (Windows has no system one; it isn't
    # guaranteed elsewhere). >=3.0.7.post0: earlier releases silently
    # no-op'd when PKG_CONFIG_PATH is set, which the pkg_config_path default
    # in meson.build relies on (pypackaging-native/pkgconf-pypi#116).
    "pkgconf>=3.0.7.post0",
    # pkg-config files + headers for MKL, located by meson.build. No upper
    # bound: Intel's last macOS MKL is 2023.2, so macOS resolves that while
    # other platforms get the latest.
    "mkl-devel>=2023.0",
    "mkl-include>=2023.0",
]

[project]
name = 'pydiso'
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Wrapper for intel's pardiso implementation in the MKL"
readme = 'README.md'
requires-python = '>=3.12'
authors = [
  {name = 'SimPEG developers', email = 'josephrcapriotti@gmail.com'},
]
keywords = [
    'sparse', 'solver', 'wrapper',
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/mesonbuild/meson-python/issues/29
    # Minimums follow SPEC 0: https://scientific-python.org/specs/spec-0000/
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    # Runtime MKL libraries (see mkl-devel above re: macOS). conda-forge
    # installs with `pip install --no-deps` and supplies its own mkl
    # package instead, as it does for numpy/scipy.
    "mkl>=2023.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

[project.optional-dependencies]
test = [
    "pytest",
]

coverage = [
    "coverage",
]

build = [
    "meson-python>=0.21.0",
    "meson",
    "ninja",
    "numpy>=2.2.0",
    "cython>=3.1.0",
    "setuptools_scm",
]

[project.urls]
Homepage = 'https://simpeg.xyz'
#Documentation = 'https://discretize.simpeg.xyz'
Repository = 'https://github.com/simpeg/pydiso.git'

[tool.setuptools_scm]

[tool.meson-python]
# One abi3 wheel per platform instead of one per Python version.
# Free-threaded builds opt out via `-Dpython.allow_limited_api=false`
# for now: Cython 3.3.0 doesn't yet generate correct code for abi3t
# (Py_TARGET_ABI3T) - only an experimental branch does (cython/cython#7399).
# Revisit once Cython ships real support.
limited-api = true

[tool.cibuildwheel]
# cp312-* covers 3.12-3.15 (GIL-enabled) as one abi3 wheel. Both
# free-threaded builds fall back to per-version wheels below (see
# [tool.meson-python]).
build = ["cp312-*", "cp314t-*", "cp315t-*"]
skip = "*-musllinux*"
# 64-bit only: MKL isn't meaningfully available for 32-bit. Without this,
# cibuildwheel also tries win32/manylinux_i686 by default and fails.
archs = "auto64"
# vsenv=true forces MSVC over the MinGW gcc also on the Windows runner's
# PATH (see python-package-conda.yml for the same issue).
config-settings = { setup-args = ["-Dvsenv=true"] }
# Runs the real test suite against each finished wheel, installed with its
# real dependencies (the `mkl` package from PyPI).
test-requires = "pytest"
test-command = "pytest {project}/tests -v"

[[tool.cibuildwheel.overrides]]
# Both free-threaded builds use the regular API - see [tool.meson-python].
# Repeated in full: overriding a shared key replaces rather than appends,
# even with inherit.config-settings = "append".
select = ["cp314t-*", "cp315t-*"]
config-settings = { setup-args = ["-Dvsenv=true", "-Dpython.allow_limited_api=false"] }

[tool.cibuildwheel.linux]
# The manylinux images preset PKG_CONFIG_PATH, which meson ranks above the
# default in meson.build that finds PyPI's mkl-devel. Pin the isolated build
# environment to a known directory so its .pc files can be added explicitly.
before-build = "rm -rf /tmp/build-env"
build-frontend = { name = "build", args = ["--env-dir=/tmp/build-env"] }
environment = { PKG_CONFIG_PATH = "/tmp/build-env/lib/pkgconfig:$PKG_CONFIG_PATH" }
# MKL comes from the `mkl` dependency at runtime, so it isn't bundled.
repair-wheel-command = 'auditwheel repair --exclude "libmkl*" -w {dest_dir} {wheel}'

[tool.cibuildwheel.windows]
repair-wheel-command = 'delvewheel repair --exclude mkl_rt.*.dll -w {dest_dir} -v {wheel}'

[tool.pytest.ini_options]
# Default "prepend" mode would shadow an installed pydiso with this
# source tree's own pydiso/ (no compiled extension); importlib mode avoids
# that by not touching sys.path.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["pydiso", "tests"]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"