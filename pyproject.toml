
[build-system]
build-backend = 'mesonpy'
requires = [
    # >=0.21.0 for abi3t (stable ABI for free-threaded builds) support.
    "meson-python>=0.21.0",
    "Cython>=3.1.0",
    "setuptools_scm[toml]>=6.2",
    "numpy>=2.2.0",
    # CMake config + headers for MKL (meson.build locates MKLConfig.cmake
    # via mkl-devel). No upper bound: Intel's last macOS MKL is 2023.2, so
    # macOS resolves that while other platforms get the latest.
    "mkl-devel>=2023.0",
    "mkl-include>=2023.0",
    # Needed to locate MKLConfig.cmake; see pydiso/meson.build.
    "cmake",
    # Not listed: mkl-static is an 827MB download, only needed for
    # `-Dmkl-link=static` (meson.options). Install it manually and build
    # with `--no-build-isolation` to use that option.
]

[project]
name = 'pydiso'
dynamic = ["version"]
description = "Wrapper for intel's pardiso implementation in the MKL"
readme = 'README.md'
requires-python = '>=3.12'
authors = [
  {name = 'SimPEG developers', email = 'josephrcapriotti@gmail.com'},
]
keywords = [
    'sparse', 'solver', 'wrapper',
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/mesonbuild/meson-python/issues/29
    # Minimums follow SPEC 0: https://scientific-python.org/specs/spec-0000/
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    # Runtime MKL libraries (see mkl-devel above re: macOS). conda-forge
    # installs with `pip install --no-deps` and supplies its own mkl
    # package instead, as it does for numpy/scipy.
    "mkl>=2023.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

[project.license]
file = 'LICENSE'

[project.optional-dependencies]
test = [
    "pytest",
]

coverage = [
    "coverage",
]

build = [
    "meson-python>=0.21.0",
    "meson",
    "ninja",
    "numpy>=2.2.0",
    "cython>=3.1.0",
    "setuptools_scm",
]

[project.urls]
Homepage = 'https://simpeg.xyz'
#Documentation = 'https://discretize.simpeg.xyz'
Repository = 'https://github.com/simpeg/pydiso.git'

[tool.setuptools_scm]

[tool.meson-python]
# One abi3 wheel per platform instead of one per Python version.
# Free-threaded builds opt out via `-Dpython.allow_limited_api=false`
# for now: Cython 3.3.0 doesn't yet generate correct code for abi3t
# (Py_TARGET_ABI3T) - only an experimental branch does (cython/cython#7399).
# Revisit once Cython ships real support.
limited-api = true

[tool.cibuildwheel]
# cp312-* covers 3.12-3.15 (GIL-enabled) as one abi3 wheel. Both
# free-threaded builds fall back to per-version wheels below (see
# [tool.meson-python]).
build = ["cp312-*", "cp314t-*", "cp315t-*"]
skip = "*-musllinux*"
# 64-bit only: MKL_ARCH is hardcoded to intel64 (pydiso/meson.build) and
# MKL isn't meaningfully available for 32-bit. Without this, cibuildwheel
# also tries win32/manylinux_i686 by default and fails.
archs = "auto64"
# Statically linked (meson.options), so MKL needs no runtime dependency
# at import time. iomp threading still needs libiomp5, which the repair
# step (auditwheel/delvewheel) bundles automatically like any other
# shared dependency (e.g. OpenBLAS). Isolation is off so before-build can
# install mkl-static (827MB, opt-in) into the same prefix as mkl-devel -
# pip's isolated build env is a separate prefix CMake wouldn't find it
# in. vsenv=true forces MSVC over the MinGW gcc also on the Windows
# runner's PATH (see python-package-conda.yml for the same issue).
# --upgrade + numpy>=2.5.0 (above the project's >=2.2.0 floor): cp315t
# needs numpy 2.5+ to compile under Py_TARGET_ABI3T, but manylinux images
# ship an older numpy that already satisfies the looser floor.
# wheel: needed by strip_wheel_dependency.py, run from repair-wheel-command.
before-build = "pip install --upgrade meson-python>=0.21.0 ninja Cython>=3.1.0 setuptools_scm[toml]>=6.2 numpy>=2.5.0 mkl-devel>=2023.0 mkl-include>=2023.0 cmake mkl-static wheel"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
config-settings = { setup-args = ["-Dmkl-link=static", "-Dmkl-threading=iomp", "-Dvsenv=true"] }
# Runs the real test suite against each built (and already mkl-stripped,
# see repair-wheel-command below) wheel before it's trusted - catches
# e.g. the delvewheel/libiomp5 bundling issue this would have caught
# immediately.
test-requires = "pytest"
test-command = "pytest {project}/tests -v"

[[tool.cibuildwheel.overrides]]
# Both free-threaded builds use the regular API - see [tool.meson-python].
# Repeated in full: overriding a shared key replaces rather than appends,
# even with inherit.config-settings = "append".
select = ["cp314t-*", "cp315t-*"]
config-settings = { setup-args = [
    "-Dmkl-link=static", "-Dmkl-threading=iomp", "-Dvsenv=true", "-Dpython.allow_limited_api=false",
] }

[tool.cibuildwheel.linux]
# Chains the mkl-stripping script after the default repair command, right
# on cibuildwheel's own {dest_dir} - see strip_wheel_dependency.py.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} && python {project}/.github/strip_wheel_dependency.py {dest_dir}"

[tool.cibuildwheel.windows]
# delvewheel has no rpath equivalent, so it won't find libiomp5md.dll
# under intel-openmp's <prefix>/Library/bin on its own. %VIRTUAL_ENV% is
# cibuildwheel's build venv, set by the time this repair command runs.
# Chained after it: strip_wheel_dependency.py, same as Linux above.
repair-wheel-command = 'delvewheel repair --add-path %VIRTUAL_ENV%\Library\bin -w {dest_dir} -v {wheel} && python {project}\.github\strip_wheel_dependency.py {dest_dir}'

[tool.pytest.ini_options]
# Default "prepend" mode would shadow an installed pydiso with this
# source tree's own pydiso/ (no compiled extension); importlib mode avoids
# that by not touching sys.path.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["pydiso", "tests"]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html_report"